# Petali website + Petali ID (the Netlify site, https://petali.netlify.app). Static files published from the repository root. The ONLY build step writes
# support-config.json (site root) from the SUPPORT_* environment variables (see tools/generate-support-config.mjs and PETALI-SUPPORT.md); no secret is involved.
#   /         the marketing site (index.html, feedback.html) - unchanged
#   /support  Support Petali: the standalone public page (support.html + support-page.js + support-assets/). Independent of Petali ID.
#   /id/      Petali ID: the complete account app and installable PWA (id/). It has NO support page: /id/support does not exist (404).
# There is no /app route.

[build]
  command = "node tools/generate-support-config.mjs"
  publish = "."

[build.environment]
  NODE_VERSION = "22"   # the generator imports the website's own ES modules (.js without a package.json): Node 22.12+ detects them

# ---- Petali ID: API proxy -------------------------------------------------------------------------------------------------------------
# The browser talks to the Petali Cloud THROUGH the site, so requests are same-origin and the session cookie is first-party (HttpOnly, SameSite=Strict).
# Must stay the FIRST rule and forced. Change the target if the backend moves.
[[redirects]]
  from = "/id/api/*"
  to = "https://petali-v2.onrender.com/:splat"
  status = 200
  force = true

# ---- Support Petali: the standalone public page ------------------------------------------------------------------------------------------
# /support (with or without a trailing slash) is answered with support.html (status 200 = a rewrite; the address bar keeps /support). The page has no relation to
# Petali ID: its code lives in support-assets/ and it only reads /support-config.json.
[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200
  force = true

# ---- Petali ID: routing --------------------------------------------------------------------------------------------------------------
# URL strategy: NO redirects for the app. /id, /id/ and every /id/... URL is answered with the app shell (status 200 = a rewrite; the address bar keeps
# the URL). IMPORTANT: Netlify matches redirect rules WITHOUT regard to a trailing slash and a rule cannot add or remove one, so a rule such as
# "/id -> /id/ 301" also matches "/id/" and redirects it to itself = ERR_TOO_MANY_REDIRECTS (this was the Phase 5 bug). Never add one.
# The app itself moves /id to /id/ in the address bar with history.replaceState (no HTTP redirect), because the PWA scope is /id/.
[[redirects]]
  from = "/id"
  to = "/id/index.html"
  status = 200
  force = true

# There is NO support page inside Petali ID. /id/support (and anything below it) must answer with the normal not-found response, NOT the app shell and NOT a redirect.
# These rules must stay ABOVE the catch-all "/id/*" rule below (the first matching rule wins).
[[redirects]]
  from = "/id/support"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/id/support/*"
  to = "/404.html"
  status = 404
  force = true

# Every other /id/... URL (login, register, computers, computers/<id>, plant, usage, health, reports, settings, more, and refreshes of them) is the app.
# Real files (js, css, icons, manifest, sw.js, vendor) are served first because this rule is NOT forced.
[[redirects]]
  from = "/id/*"
  to = "/id/index.html"
  status = 200

# Developer tests/tools live in the repository but are not part of the site.
[[redirects]]
  from = "/id-dev/*"
  to = "/404.html"
  status = 404
  force = true

# The backend sources and the build tools sit in the same repository but are not part of the site.
[[redirects]]
  from = "/cloud/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

# ---- headers ------------------------------------------------------------------------------------------------------------------------
[[headers]]
  for = "/id/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "no-cache"

# The service worker must never be served from a stale cache, and may control exactly /id/.
[[headers]]
  for = "/id/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/id/"
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/id/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "no-cache"

# API responses (through the proxy) must never be stored by a browser or a CDN.
[[headers]]
  for = "/id/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Support Petali: the public recipient configuration is generated at deploy time (site root) and must always be read fresh.
[[headers]]
  for = "/support-config.json"
  [headers.values]
    Cache-Control = "no-store"
    Content-Type = "application/json; charset=utf-8"

# ---- headers for the whole site (marketing pages included) ---------------------------------------------------------------------------
# The marketing pages use inline <script>/<style> and Google Fonts and post the feedback form to formsubmit.co, so they get NO Content-Security-Policy here (a policy that
# allows 'unsafe-inline' would protect nothing); they receive the hardening headers below. /id/* keeps its own strict Content-Security-Policy (set above) and does not rely on this block.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "DENY"
